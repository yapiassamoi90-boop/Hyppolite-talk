<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carena Talk</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
  <div class="app-container">
    <h2>Carena Talk</h2>
    <div class="profile-box">
      <input type="text" id="my-name-input" placeholder="Votre nom / Poste (ex: Quai 1)">
      <button onclick="saveMyName()">Valider mon Nom</button>
      <p class="id-badge">Mon ID d'appel : <b id="my-id">Génération...</b></p>
    </div>
    <p id="status">Initialisation...</p>
    <div class="call-controls">
      <p id="active-call-info" style="display: none; font-weight: bold; margin-bottom: 10px;"></p>
      <button id="end-btn" onclick="endCall()" disabled>Raccrocher</button>
    </div>
    <hr>
    <h3>Ajouter un contact</h3>
    <div class="add-contact-form">
      <input type="text" id="contact-name" placeholder="Nom du contact (ex: Chaudronnerie)">
      <input type="text" id="contact-id" placeholder="ID Carena du contact">
      <button onclick="addContact()">Enregistrer le contact</button>
    </div>
    <h3>Carnet d'adresses</h3>
    <ul id="contacts-list" class="contacts-list"></ul>
  </div>

  <audio id="remote-audio" autoplay playsinline></audio>

  <!-- Fenêtre modale d'appel entrant -->
  <div id="incoming-call-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; flex-direction: column;">
    <div style="background: #111827; padding: 24px; border-radius: 16px; border: 1px solid #374151; text-align: center; width: 90%; max-width: 320px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);">
      <h3 style="color: #38bdf8; margin-bottom: 10px; font-size: 1.2rem;">📞 Appel entrant...</h3>
      <p id="incoming-caller-name" style="font-size: 1.1rem; font-weight: bold; margin-bottom: 20px; color: #f9fafb;"></p>
      <div style="display: flex; gap: 10px;">
        <button onclick="answerIncomingCall()" style="background-color: #10b981; flex: 1;">Décrocher</button>
        <button onclick="rejectIncomingCall()" style="background-color: #ef4444; flex: 1;">Refuser</button>
      </div>
    </div>
  </div>

  <!-- Élément audio pour la sonnerie -->
  <audio id="ringtone-audio" loop>
    <source src="https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg" type="audio/ogg">
  </audio>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .catch(err => console.log('SW error: ', err));
      });
    }
  </script>
</body>
</html>
